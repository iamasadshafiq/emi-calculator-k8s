# Runs once: waits for the three mongod pods and initiates replica set rs0.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -e
              for h in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                until mongosh --host "$h:27017" --quiet --eval "db.adminCommand('ping').ok" > /dev/null 2>&1; do
                  echo "waiting for $h ..."
                  sleep 3
                done
                echo "$h:27017 is up"
              done

              mongosh --host mongo-0.mongo:27017 --quiet --eval '
                try {
                  rs.status();
                  print("replica set rs0 is already initiated");
                } catch (e) {
                  print("calling rs.initiate() ...");
                  printjson(rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo:27017" },
                      { _id: 1, host: "mongo-1.mongo:27017" },
                      { _id: 2, host: "mongo-2.mongo:27017" }
                    ]
                  }));
                }'

              echo "waiting for 1 PRIMARY and 2 SECONDARY ..."
              until [ "$(mongosh --host mongo-0.mongo:27017 --quiet --eval 'rs.status().members.map(m => m.stateStr).sort().join(",")')" = "PRIMARY,SECONDARY,SECONDARY" ]; do
                sleep 2
              done
              mongosh --host mongo-0.mongo:27017 --quiet --eval 'rs.status().members.forEach(m => print(m.name, m.stateStr))'
              echo "replica set rs0 is ready"
